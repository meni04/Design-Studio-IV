<style>
/* Layout: a fixed full-bleed WebGL stage in a white void; the page scroll is the
   timeline, and a thin stage rail at the bottom names where in the fall you are. */
:root {
  --void: #ffffff;        /* the white virtual space */
  --ink: #17181a;         /* dust-fairy ink */
  --muted: #8b8d91;
  --hair: #dcdddf;
  --dust: #b9b4ab;        /* warm grey of floating splats */
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html, body { background: var(--void); color: var(--ink); }
body { font-family: var(--font-ui); }
#stage {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; background: var(--void);
}
.scroll-track { height: 620vh; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.title { display: grid; gap: 4px; }
.title h1 {
  margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em;
  background: var(--void); padding: 2px 6px; justify-self: start;
}
.title p {
  margin: 0; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted);
  letter-spacing: 0.04em; background: var(--void); padding: 1px 6px; justify-self: start;
}
.controls { display: flex; gap: 8px; pointer-events: auto; }
.controls button {
  font: 500 0.78rem var(--font-ui); color: var(--ink); background: var(--void);
  border: 1px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.controls button:hover { background: var(--ink); color: var(--void); }
.controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.hint {
  align-self: center; font-size: 0.82rem; color: var(--muted);
  background: var(--void); padding: 4px 10px; transition: opacity .4s;
}
.rail { display: grid; gap: 10px; background: var(--void); padding-top: 10px; }
.bar { height: 1px; background: var(--hair); position: relative; }
.bar i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--ink); width: 0; }
.steps {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.steps li {
  font-size: 0.78rem; color: var(--muted); display: grid; gap: 2px;
  transition: color .3s;
}
.steps li span { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.06em; }
.steps li.on { color: var(--ink); }
.steps li.on b { font-weight: 600; }
.steps b { font-weight: 400; }
.err[hidden] { display: none; }
.err {
  position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)); color: var(--muted);
}
@media (max-width: 480px) {
  .steps li { font-size: 0.7rem; }
  .controls button { padding: 5px 10px; }
}
</style>

          float alpha = mix(1.0, g, vSoft) * vAlpha;
          if (alpha < 0.012) discard;
          gl_FragColor = vec4(vColor, alpha);
        }`
    }));
    scene.add(points);

    ready = true;
    resize();
  }

  // ---------- sizing ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    if (!W) return;
    const t = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
    baseDist = Math.max((H / 2) / t, (W / 2) / (t * camera.aspect)) * 1.04;
    if (points) points.material.uniforms.uScale.value = (h * renderer.getPixelRatio()) / (2 * t);
  }
  window.addEventListener('resize', resize);

  // ---------- timeline ----------
  let target = 0, prog = 0, playing = false;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function scrollProgress() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    return max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
  }
  window.addEventListener('scroll', () => { target = scrollProgress(); }, { passive: true });
  // test hook: jump straight to a progress value
  window.setProgress = p => { target = prog = clamp(p, 0, 1); };

  const playBtn = document.getElementById('play');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '일시 정지' : '자동 재생';
    if (playing && scrollProgress() > 0.99) window.scrollTo(0, 0);
  });
  document.getElementById('reset').addEventListener('click', () => {
    playing = false; playBtn.textContent = '자동 재생';
    window.scrollTo(0, 0); target = 0;
  });

  const steps = [...document.querySelectorAll('#steps li')];
  const fill = document.getElementById('fill');
  const hint = document.getElementById('hint');

  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;
    if (playing) {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollBy(0, max * dt / 14);
      if (scrollProgress() >= 0.999) { playing = false; playBtn.textContent = '자동 재생'; }
    }
    prog += (target - prog) * (reduce ? 1 : Math.min(1, dt * 4));
    const p = prog;

    fill.style.width = (p * 100).toFixed(1) + '%';
    const stage = p < 0.08 ? 0 : p < 0.3 ? 1 : p < 0.66 ? 2 : 3;
    steps.forEach((li, i) => li.classList.toggle('on', i === stage));
    hint.style.opacity = p > 0.03 ? 0 : 1;

    if (!ready) return;
    const U = (m, k, v) => { m.material.uniforms[k].value = v; };

    // 1 pixelate
    U(plane, 'uPix', 1 + 27 * smooth(0.06, 0.28, p));
    U(plane, 'uOpacity', 1 - smooth(0.28, 0.33, p));
    plane.visible = p < 0.34;

    // 2 tiles
    const sep = easeIO(smooth(0.3, 0.62, p));
    U(tiles, 'uSep', sep);
    U(tiles, 'uPix', 28 - 20 * sep);
    U(tiles, 'uOpacity', smooth(0.27, 0.31, p) * (1 - smooth(0.62, 0.74, p)));
    tiles.visible = p > 0.26 && p < 0.75;

    // 3 splats
    const morph = easeIO(smooth(0.63, 0.86, p));
    U(points, 'uMorph', morph);
    U(points, 'uSoft', smooth(0.64, 0.84, p));
    U(points, 'uOpacity', smooth(0.6, 0.72, p));
    U(points, 'uDiss', smooth(0.82, 1.0, p));
    U(points, 'uFloat', smooth(0.75, 0.95, p));
    U(points, 'uTime', time);
    points.visible = p > 0.59;

    // camera
    const k = easeIO(smooth(0.3, 1.0, p));
    const yaw = 0.42 * k + Math.sin(time * 0.35) * 0.04 * smooth(0.85, 1, p);
    const pitch = 0.2 * k;
    const tgt = new THREE.Vector3(0, -0.05 * k, -0.38 * k);
    const R = baseDist * (1 + 0.18 * k);
    camera.position.set(
      tgt.x + R * Math.sin(yaw) * Math.cos(pitch),
      tgt.y + R * Math.sin(pitch),
      tgt.z + R * Math.cos(yaw) * Math.cos(pitch)
    );
    camera.lookAt(tgt);
    renderer.render(scene, camera);
  }
  resize();
  frame();
})();
</script>

</body></html>
