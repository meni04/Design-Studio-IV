<style>
/* Layout: a full-bleed WebGL field of lost objects on hub-colored lightbox plates; UI floats over it as a pill bar (top), legend (bottom-right) and a record sheet (right / bottom on phones). Single light look, chosen on purpose. */
:root{
  --ground:#F6F8FB;
  --sky:#FFFFFF;
  --floor:#D6EBF8;
  --ink:#1B2130;
  --muted:#667086;
  --line:#D3DAE6;
  --panel:rgba(255,255,255,.92);
  --lib:#C0E7F8;
  --jo:#FDD7B5;
  --bug:#C5CDFF;
  --none:#E3E6EC;
  --focus:#3B6FD8;
  --f-display:"Instrument Serif", "Times New Roman", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:linear-gradient(to bottom,var(--sky) 0%,var(--sky) 58%,var(--floor) 100%);touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.045;mix-blend-mode:multiply;background-size:180px 180px}

/* Top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:14px;width:min(640px,100%);min-width:0;height:46px;padding:0 8px 0 20px;border:1.5px solid var(--ink);border-radius:999px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mark{font-family:var(--f-display);font-size:22px;letter-spacing:.01em;white-space:nowrap;line-height:1}
.mark i{font-style:italic}
.pill input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:8px 4px;border-left:1px solid var(--line);padding-left:14px}
.pill input::placeholder{color:var(--muted)}
.pill input:focus{outline:none}
.pill:focus-within{box-shadow:0 0 0 3px rgba(59,111,216,.18)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-right:10px;font-variant-numeric:tabular-nums}
.row{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.chip,.seg button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .sw{width:10px;height:10px;border-radius:3px;border:1px solid rgba(27,33,48,.25)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip[aria-pressed="true"] .sw{border-color:#fff}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Legend */
.legend{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:248px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.legend h2{margin:0 0 8px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(27,33,48,.2)}
.legend .lv{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend p{margin:9px 0 0;font-size:11.5px;line-height:1.5;color:var(--muted)}

/* Hint */
.hint{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100% - 300px));font-family:var(--f-mono);font-size:11.5px;line-height:1.7;color:var(--muted)}
.hint b{font-weight:500;color:var(--ink)}
.walk{display:none;gap:6px;margin-top:8px}
.walk button{font:inherit;font-family:var(--f-body);font-size:13px;border:1px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 14px;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.walk{display:flex}}

/* Record sheet */
.sheet{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sheet-head .nav{display:flex;gap:6px}
.sheet-head button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink)}
.sheet-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:0}
.plate{border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden;max-width:100%}
.plate::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%)}
.plate img{position:relative;max-width:78%;max-height:78%;object-fit:contain}
.plate .noimg{position:relative;font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px dashed rgba(27,33,48,.35);padding:22px 26px;border-radius:8px}
.ai{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:10.5px;background:rgba(255,255,255,.8);padding:2px 7px;border-radius:999px;color:var(--muted)}
.sheet h1{margin:0;font-size:22px;font-weight:600;text-wrap:balance;line-height:1.3}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.state{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.badge{align-self:flex-start;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid var(--ink)}
.badge.ret{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.state small{font-size:12px;color:var(--muted);line-height:1.55}
.rec h3{margin:0 0 8px;font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.rec dl{margin:0;display:grid;gap:10px}
.rec dt{font-size:12px;color:var(--muted)}
.rec dd{margin:2px 0 0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.rec .warn{font-size:12px;color:#8A5A12;background:#FFF5E6;border-radius:6px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
.quote{font-family:var(--f-display);font-size:24px;line-height:1.3;font-style:italic}
.foot{font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}

.tip{position:fixed;z-index:5;pointer-events:none;font-family:var(--f-mono);font-size:11.5px;background:var(--ink);color:#fff;padding:4px 8px;border-radius:4px;transform:translate(-50%,-140%);white-space:nowrap}

@media (max-width:720px){
  .legend{width:auto;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 12px}
  .legend ul{grid-template-columns:1fr 1fr}
  .legend p{display:none}
  .hint{bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:none;right:max(16px,env(safe-area-inset-right,0px))}
  .hint .keys{display:none}
  .mark{font-size:18px}
  .count{display:none}
  .sheet{top:auto;width:100%;height:78%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%)}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

  </div>
  <div class="sheet-body" id="sh-body"></div>
</aside>

/* hub nodes */
const hubNodes={};
HUB_ORDER.forEach(k=>{const c=document.createElement('canvas');c.width=640;c.height=150;const g=c.getContext('2d');
  fontsReady.then(()=>{g.clearRect(0,0,640,150);g.fillStyle=HUBS[k].color;g.strokeStyle='#1B2130';g.lineWidth=3;g.beginPath();g.arc(48,62,26,0,7);g.fill();g.stroke();
    g.fillStyle='#1B2130';g.font='600 46px "IBM Plex Sans KR", sans-serif';g.fillText(HUBS[k].name+(k==='none'?'':' 허브'),92,78);
    g.font='500 24px "IBM Plex Mono", monospace';g.fillStyle='#667086';const p=DATA.points[k]||0;
    g.fillText(k==='none'?'건물 특정 불가 · 집계 제외 · '+counts[k]+' objects':'LV.'+lvOf(p)+' · '+p+' pts · '+counts[k]+' objects',92,118);t.needsUpdate=true;});
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(17,4,1);
  const h=H3[k];s.userData={p3:new THREE.Vector3(h.c[0],h.c[1]+h.r[1]+9,h.c[2]),p2:hub2[k].clone().add(new THREE.Vector3(0,3.2,0)),center3:new THREE.Vector3(...h.c)};
  s.position.copy(s.userData.p3);scene.add(s);hubNodes[k]=s;});

/* network lines: 2 nearest in hub + hub node */
const pairs=[];
ITEMS.forEach(a=>{const near=ITEMS.filter(b=>b!==a&&b.hub===a.hub).map(b=>[b,a.p3.distanceTo(b.p3)]).sort((x,y)=>x[1]-y[1]).slice(0,2);
  near.forEach(([b])=>{if(!pairs.some(p=>p[0]===b&&p[1]===a))pairs.push([a,b])});pairs.push([a,null]);});
const lineGeo=new THREE.BufferGeometry();const lp=new Float32Array(pairs.length*6);lineGeo.setAttribute('position',new THREE.BufferAttribute(lp,3));
const lineMat=new THREE.LineBasicMaterial({color:0x8E9AB2,transparent:true,opacity:.24});
const lines=new THREE.LineSegments(lineGeo,lineMat);scene.add(lines);

/* ---------- camera / modes ---------- */
let mode='3d', tMode=0, tModeTarget=0;          // 0 = 3D field, 1 = 2D canvas
const cam={pos:new THREE.Vector3(0,3,24),yaw:0,pitch:-0.02};
const cam3Saved={pos:cam.pos.clone(),yaw:0,pitch:-0.02};
const vel=new THREE.Vector3();
let fly=null;                                     // {from,to,yaw0,yaw1,p0,p1,t,dur}
function dist2D(){const a=renderer.domElement.clientWidth/renderer.domElement.clientHeight;const half=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const byW=(W2/2+8)/(half*a), byH=(70/2)/half;return Math.max(byW,byH);}
function center2D(){return new THREE.Vector3(0,-6,Z2+dist2D())}
function startFly(toPos,toYaw,toPitch,dur){fly={from:cam.pos.clone(),to:toPos.clone(),yaw0:cam.yaw,yaw1:toYaw,p0:cam.pitch,p1:toPitch,t:0,dur:RM?0.01:dur};}
function setMode(m){if(m===mode)return;
  if(m==='2d'){cam3Saved.pos.copy(cam.pos);cam3Saved.yaw=cam.yaw;cam3Saved.pitch=cam.pitch;tModeTarget=1;startFly(center2D(),0,0,1.3);}
  else{tModeTarget=0;startFly(cam3Saved.pos,cam3Saved.yaw,cam3Saved.pitch,1.3);}
  mode=m;document.getElementById('m3').setAttribute('aria-pressed',m==='3d');document.getElementById('m2').setAttribute('aria-pressed',m==='2d');
  document.querySelector('.keys').innerHTML=m==='3d'?'<b>드래그</b> 둘러보기 · <b>휠 / W S</b> 걸어 들어가기 · <b>A D</b> 옆으로 · <b>Q E</b> 아래·위 · <b>물건 클릭</b> 기록 열기':'<b>드래그</b> 캔버스 이동 · <b>휠</b> 확대·축소 · <b>물건 클릭</b> 기록 열기';}
document.getElementById('m3').onclick=()=>setMode('3d');
document.getElementById('m2').onclick=()=>setMode('2d');
function lookAtYawPitch(from,to){const d=to.clone().sub(from);return[Math.atan2(-d.x,-d.z),Math.atan2(d.y,Math.hypot(d.x,d.z))];}
function focusItem(it){
  if(mode==='3d'){const p=it.mesh.position.clone();const dir=cam.pos.clone().sub(p);dir.y=0;if(dir.length()<1)dir.set(0,0,1);dir.normalize();
    const to=p.clone().add(dir.multiplyScalar(15)).add(new THREE.Vector3(0,-.4,0));const [y,pi]=lookAtYawPitch(to,p);startFly(to,y,pi,1.1);}
  else{const p=it.p2;startFly(new THREE.Vector3(p.x+(innerWidth>720?4:0),p.y-(innerWidth>720?0:5),Z2+26),0,0,.9);}}
function focusHub(k){
  if(mode==='3d'){const h=H3[k];const c=new THREE.Vector3(...h.c);const to=c.clone().add(new THREE.Vector3(0,4,h.r[2]+34));const [y,pi]=lookAtYawPitch(to,c);startFly(to,y,pi,1.4);}
  else{const p=hub2[k];const rows=Math.ceil(counts[k]/COLS[k]);startFly(new THREE.Vector3(p.x,p.y-rows*CH/2,Z2+Math.max(40,rows*CH*1.6+COLS[k]*CW*.9)),0,0,1);}}

/* ---------- filter ---------- */
const countEl=document.getElementById('count');
function matches(it){return(hubFilter==='all'||it.hub===hubFilter)&&(!query||it.name.toLowerCase().includes(query)||it.cat.includes(query)||it.place.includes(query));}
function applyFilter(){let n=0;ITEMS.forEach(it=>{it.on=matches(it);if(it.on)n++;});countEl.textContent=n+' / '+ITEMS.length+' objects';
  lineMat.opacity=(hubFilter==='all'&&!query)?.24:.1;}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();applyFilter();});
applyFilter();

/* ---------- record sheet ---------- */
const sheet=document.getElementById('sheet'),body=document.getElementById('sh-body');
let current=null;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openItem(it,fly=true){current=it;setSharp(it);
  document.getElementById('sh-no').textContent='No.'+String(it.no).padStart(3,'0')+' / '+ITEMS.length;
  const hub=HUBS[it.hub];const pct=Math.round(it.clar*100);
  const msg=it.recs.map(r=>r.msg).find(Boolean);
  let h='<div class="plate" style="background:'+hub.color+'">'+(it.img?'<img src="img/'+it.img+'.png" alt="'+esc(it.name)+' 이미지">':'<span class="noimg">이미지 준비 중</span>')+(it.img?'<span class="ai">AI 생성 이미지</span>':'')+'</div>';
  h+='<div><h1>'+esc(it.name)+'</h1><div class="meta">'+hub.name+(it.hub==='none'?'':' 허브')+' · '+esc(it.place)+'<br>'+esc(it.cat)+'</div></div>';
  h+='<div class="state"><span class="badge'+(it.returned?' ret':'')+'">'+(it.returned?'현실로 돌아감 · ':'먼지 창고에 보관 중 · ')+esc(it.outcome)+'</span>'+
     '<div class="meter" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
     '<small>선명도 '+pct+'% · '+(it.returned?'다시 찾은 물건이라 창고에서는 거의 투명합니다.':'설문의 “지금도 생각나는 정도” 응답을 1–5에서 환산한 잠정값입니다. 공간에서는 흐리게 떠 있다가, 열어 본 동안만 라이트박스 위에 선명하게 보입니다.')+'</small></div>';
  if(msg)h+='<div class="quote">“'+esc(msg)+'”</div>';
  it.recs.forEach(r=>{h+='<section class="rec"><h3>'+(r.src==='A'?'설문 A · 학교 경험 설문':'설문 B · 국민대 분실물 설문')+' · '+r.ts+' 응답</h3>';
    if(r.shift)h+='<div class="warn">원본 시트에서 이 응답의 열이 밀려 있어 일부 항목은 확인이 필요합니다.</div>';
    h+='<dl>'+r.fields.map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl></section>';});
  if(it.note)h+='<div class="foot">비고 · '+esc(it.note)+'</div>';
  h+='<div class="foot">응답자의 연락처와 이름은 아카이브에 싣지 않았습니다.</div>';
  body.innerHTML=h;body.scrollTop=0;sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');
  if(fly)focusItem(it);}
function closeSheet(){setSharp(null);sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');current=null;}
document.getElementById('close').onclick=closeSheet;
function step(d){const list=ITEMS.filter(i=>i.on);if(!list.length)return;let i=current?list.indexOf(current):-1;i=(i+d+list.length)%list.length;openItem(list[i]);}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);

/* ---------- input ---------- */
const el=renderer.domElement, ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), tip=document.getElementById('tip');
let drag=null, pinch=null, hover=null;const ptrs=new Map();
function pick(x,y){const r=el.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(meshes.filter(m=>m.userData.it.on),false)[0];return hit?hit.object.userData.it:null;}
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:0};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);drag=null;}});
el.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch!=null&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);move((d-pinch)*0.12);pinch=d;fly=null;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(drag.moved>5){fly=null;
      if(mode==='3d'){cam.yaw+=dx*0.0035;cam.pitch=THREE.MathUtils.clamp(cam.pitch+dy*0.0035,-1.2,1.2);}
      else{const k=(cam.pos.z-Z2)*0.0018;cam.pos.x-=dx*k;cam.pos.y+=dy*k;}}
    return;}
  if(e.pointerType==='mouse'){const it=pick(e.clientX,e.clientY);hover=it;el.style.cursor=it?'pointer':'grab';
    if(it){tip.hidden=false;tip.textContent='No.'+String(it.no).padStart(3,'0')+' · '+it.name;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';}else tip.hidden=true;}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&drag.moved<=5&&ptrs.size===0){const it=pick(e.clientX,e.clientY);if(it)openItem(it);}
  if(ptrs.size===0)drag=null;}
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('pointerleave',()=>{tip.hidden=true;hover=null;});
el.addEventListener('wheel',e=>{e.preventDefault();fly=null;move(-e.deltaY*(e.ctrlKey?0.25:0.05));},{passive:false});
function move(a){if(mode==='3d'){const f=new THREE.Vector3(-Math.sin(cam.yaw)*Math.cos(cam.pitch),Math.sin(cam.pitch),-Math.cos(cam.yaw)*Math.cos(cam.pitch));vel.addScaledVector(f,a*0.5);}
  else{cam.pos.z=THREE.MathUtils.clamp(cam.pos.z-a*1.2,Z2+14,Z2+dist2D()*1.6);}}
const keys={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=true;if(e.key==='Escape')closeSheet();
  if(e.key==='ArrowRight'&&current)step(1);if(e.key==='ArrowLeft'&&current)step(-1);});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function hold(btn,a){let id=null;const go=()=>{fly=null;move(a)};btn.addEventListener('pointerdown',e=>{e.preventDefault();go();id=setInterval(go,40);});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,()=>{clearInterval(id);}));}
hold(document.getElementById('fwd'),1.2);hold(document.getElementById('back'),-1.2);

/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clock=new THREE.Clock();const tmp=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
  // mode morph
  const sp=RM?1:dt/1.3;tMode+=Math.sign(tModeTarget-tMode)*Math.min(Math.abs(tModeTarget-tMode),sp);const m=ease(tMode);
  // keys
  if(mode==='3d'){const f=new THREE.Vector3(-Math.sin(cam.yaw),0,-Math.cos(cam.yaw)),r=new THREE.Vector3(Math.cos(cam.yaw),0,-Math.sin(cam.yaw));const a=26*dt;
    if(keys.w||keys.arrowup){vel.addScaledVector(f,a);fly=null}if(keys.s||keys.arrowdown){vel.addScaledVector(f,-a);fly=null}
    if(keys.d){vel.addScaledVector(r,a);fly=null}if(keys.a){vel.addScaledVector(r,-a);fly=null}
    if(keys.e){vel.y+=a;fly=null}if(keys.q){vel.y-=a;fly=null}
    cam.pos.addScaledVector(vel,dt*4);vel.multiplyScalar(Math.pow(.04,dt));}
  else vel.set(0,0,0);
  if(fly){fly.t+=dt/fly.dur;const k=ease(Math.min(fly.t,1));cam.pos.lerpVectors(fly.from,fly.to,k);
    let dy=fly.yaw1-fly.yaw0;dy=Math.atan2(Math.sin(dy),Math.cos(dy));cam.yaw=fly.yaw0+dy*k;cam.pitch=fly.p0+(fly.p1-fly.p0)*k;if(fly.t>=1)fly=null;}
  camera.position.copy(cam.pos);camera.rotation.set(cam.pitch,cam.yaw,0);
  // items
  ITEMS.forEach(it=>{const me=it.mesh;me.position.lerpVectors(it.p3,it.p2,m);if(!RM)me.position.y+=Math.sin(T*.6+it.phase)*.35*(1-m);
    me.quaternion.copy(camera.quaternion);const target=(it.on?1:.1);me.material.opacity+=(target-me.material.opacity)*Math.min(1,dt*8);
    const sc=(hover===it||current===it)?1.1:1;me.scale.setScalar(me.scale.x+(sc-me.scale.x)*Math.min(1,dt*10));});
  HUB_ORDER.forEach(k=>{const s=hubNodes[k];s.position.lerpVectors(s.userData.p3,s.userData.p2,m);
    s.material.opacity=(hubFilter==='all'||hubFilter===k)?1:.25;});
  let i=0;pairs.forEach(([a,b])=>{const p=a.mesh.position,q=b?b.mesh.position:hubNodes[a.hub].position;lp[i++]=p.x;lp[i++]=p.y;lp[i++]=p.z;lp[i++]=q.x;lp[i++]=q.y;lp[i++]=q.z;});
  lineGeo.attributes.position.needsUpdate=true;
  grid.material.opacity=.55*(1-m);scene.fog.far=420+m*400;
  renderer.render(scene,camera);}
frame();
</script>

</body></html>
